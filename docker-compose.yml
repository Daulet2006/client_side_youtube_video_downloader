version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: yt_backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: yt_frontend
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: yt_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
